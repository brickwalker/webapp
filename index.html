<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Кохаю</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --vg-blue: #0b1b3b;
      --vg-yellow: #f6c945;
      --vg-accent: #1f4f7b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #203a72 0, #050814 55%, #02030a 100%);
      color: #fdf7e3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .canvas {
      width: 100%;
      max-width: 480px;
      background: rgba(5, 8, 20, 0.9);
      border-radius: 18px;
      padding: 20px 18px 24px;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(246, 201, 69, 0.4);
      position: relative;
      overflow: hidden;
    }

    .canvas::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 10% 20%, rgba(246, 201, 69, 0.18) 0, transparent 55%),
        radial-gradient(circle at 80% 10%, rgba(135, 206, 250, 0.18) 0, transparent 55%),
        radial-gradient(circle at 20% 90%, rgba(255, 255, 255, 0.08) 0, transparent 60%);
      opacity: 0.9;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #ffeaa7;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
    }

    .subtitle {
      font-size: 0.95rem;
      color: #e0e6ff;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 999px;
      border: none;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, var(--vg-yellow), #ffdd6b);
      color: #3b2600;
      box-shadow:
        0 10px 20px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    }

    .btn:active {
      transform: translateY(1px) scale(0.99);
      box-shadow:
        0 6px 12px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(0, 0, 0, 0.5);
      filter: brightness(0.96);
    }

    .sunflower-panel {
      margin-top: 20px;
      padding: 14px 12px 16px;
      border-radius: 16px;
      background:
        radial-gradient(circle at 10% 0, rgba(255, 255, 255, 0.12) 0, transparent 55%),
        linear-gradient(135deg, #f6c945 0, #f3a712 40%, #c97a1f 100%);
      color: #3b1f00;
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(0, 0, 0, 0.35);
      display: none;
    }

    .sunflower-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .sunflower-icon {
      font-size: 1.8rem;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.4));
    }

    .sunflower-title {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .sunflower-art {
      margin: 8px 0 10px;
      padding: 10px;
      border-radius: 12px;
      background:
        repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0.18) 2px,
          rgba(255, 255, 255, 0.02) 2px,
          rgba(255, 255, 255, 0.02) 6px
        ),
        radial-gradient(circle at 20% 10%, #ffeaa7 0, #f6c945 40%, #c97a1f 100%);
      text-align: center;
      font-size: 1.6rem;
      line-height: 1.4;
      box-shadow: inset 0 0 0 1px rgba(59, 31, 0, 0.25);
    }

    .sunflower-art span {
      display: inline-block;
      transform: rotate(-4deg);
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.35);
    }

    .love-text {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.5;
    }

    .hearts {
      margin-top: 4px;
      font-size: 1.3rem;
    }

    @media (max-width: 360px) {
      h1 {
        font-size: 1.25rem;
      }
      .subtitle {
        font-size: 0.9rem;
      }
      .btn {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="content">
     <div id="loveParagraph">
      <h1>Що це?</h1>
      <p class="subtitle">
        Ще одне нагадування у твоїй кишені...
      </p>
      <button class="btn" id="loveBtn">Натисни тут</button>
     </div>

      <div class="sunflower-panel" id="sunflowerPanel">
        <div class="sunflower-header">
          <div class="sunflower-icon">🌻</div>
          <div class="sunflower-title">Кохаю тебе до нестями, Тусаньчик!</div>
        </div>

        <div class="sunflower-art">
          <span>🌻🌻🌻<br/>🌻🌻🌻<br/>🌻🌻🌻</span>
        </div>

        <div class="love-text">
          Вибач, що я з'їв цілий Контік. Я залишив тобі інший (молочний).
          <div class="hearts">💛💙</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const btn = document.getElementById("loveBtn");
    const prg = document.getElementById("loveParagraph");
    const panel = document.getElementById("sunflowerPanel");

    btn.addEventListener("click", () => {
      prg.style.display = "none"
      panel.style.display = "block";
      panel.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  </script>
</body>
</html>
